name: Deploy website

# Publishes the app to GitHub Pages (https://<owner>.github.io/<repo>/) every time the default
# branch changes, or on demand from the Actions tab.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Until Pages is switched on there is nowhere to publish: say so instead of failing.
  pages-on:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages is off. Turn it on (Settings → Pages → Source: GitHub Actions), then run this workflow again."
          fi

  build:
    needs: pages-on
    if: needs.pages-on.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # Serve the pose models from the site itself (the app falls back to Google's CDN without them).
      - run: npm run fetch-models
        continue-on-error: true
      # Pages has no server for the AI debrief, so every set gets the on-device summary.
      - run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_AI_DEBRIEF: 'off'
      # Any unknown address opens the app instead of GitHub's error page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
